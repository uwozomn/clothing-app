<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服飾店商品管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f2ed;
  --bg-card: #faf8f5;
  --bg-sidebar: #1a1814;
  --text-primary: #1a1814;
  --text-secondary: #7a7268;
  --text-muted: #b0aa9f;
  --text-sidebar: #e8e2d8;
  --text-sidebar-muted: #7a7060;
  --border: rgba(26,24,20,0.1);
  --border-strong: rgba(26,24,20,0.2);
  --accent: #c8392b;
  --accent-soft: rgba(200,57,43,0.08);
  --sidebar-w: 220px;
  --font-serif: 'Noto Serif TC', serif;
  --font-sans: 'Noto Sans TC', sans-serif;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  padding: 0;
  z-index: 10;
}
.sidebar-brand {
  padding: 28px 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sidebar-brand-name {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 400;
  color: var(--text-sidebar);
  letter-spacing: 0.04em;
  line-height: 1.4;
}
.sidebar-brand-sub {
  font-size: 10px;
  color: var(--text-sidebar-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 3px;
}
.sidebar-nav {
  flex: 1;
  padding: 16px 0;
  overflow-y: auto;
}
.nav-section-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-sidebar-muted);
  padding: 12px 20px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  font-size: 13px;
  color: var(--text-sidebar-muted);
  cursor: pointer;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  font-weight: 300;
  letter-spacing: 0.02em;
  user-select: none;
}
.nav-item:hover { color: var(--text-sidebar); background: rgba(255,255,255,0.04); }
.nav-item.active { color: var(--text-sidebar); border-left-color: var(--accent); background: rgba(255,255,255,0.05); }
.nav-icon { font-size: 16px; width: 18px; text-align: center; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar-count {
  margin-left: auto;
  font-size: 10px;
  background: rgba(255,255,255,0.08);
  color: var(--text-sidebar-muted);
  padding: 1px 6px;
  border-radius: 8px;
}

/* ── Main ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  background: var(--bg);
  flex-shrink: 0;
}
.topbar-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 400;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}
.topbar-breadcrumb {
  font-size: 12px;
  color: var(--text-muted);
}
.topbar-breadcrumb span { color: var(--text-secondary); }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; }
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
  font-weight: 400;
}
.btn-ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--border); color: var(--text-primary); }
.btn-accent { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
.btn-accent:hover { opacity: 0.9; }

.page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 28px 28px;
}

/* ── Filter tabs ── */
.filter-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.filter-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-strong);
  background: transparent;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-sans);
  white-space: nowrap;
}
.filter-tab:hover { background: var(--bg-card); color: var(--text-primary); }
.filter-tab.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
.filter-tab-count {
  font-size: 10px;
  opacity: 0.6;
}
.filter-tab.active .filter-tab-count { opacity: 0.7; }

/* ── Category overview (homepage) ── */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-top: 4px;
}
.cat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.cat-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
}
.cat-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }
.cat-card:hover::after { transform: scaleX(1); }
.cat-card-icon { font-size: 26px; margin-bottom: 12px; }
.cat-card-name { font-family: var(--font-serif); font-size: 15px; font-weight: 400; margin-bottom: 4px; }
.cat-card-count { font-size: 11px; color: var(--text-muted); }
.cat-card-prices { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
.price-pip {
  font-size: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 500;
}

/* ── Board view ── */
.board-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer; padding: 5px 0;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--text-primary); }
/* ── Items grid ── */
.items-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
}
@media (max-width: 1100px) {
  .items-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 680px) {
  .items-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}

.board-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 20px;
  align-items: flex-start;
}
.board-scroll::-webkit-scrollbar { height: 5px; }
.board-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.price-col {
  flex-shrink: 0;
  width: 200px;
}
.price-col-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 0 2px;
}
.price-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}
.price-label-count { font-size: 11px; color: var(--text-muted); }
.price-divider {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Item card ── */
.item-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.item-card:hover { border-color: var(--border-strong); box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.item-price-banner {
  background: var(--accent);
  color: #fff;
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.04em;
  padding: 6px 12px;
  text-align: center;
  width: 100%;
}
.item-img-wrap { aspect-ratio: 3/4; overflow: hidden; background: #eae6e0; }
.item-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
.item-card:hover .item-img-wrap img { transform: scale(1.03); }
.item-body { padding: 9px 11px; border-top: 1px solid var(--border); }
.item-attr-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 3px; }
.item-attr-label { font-size: 9px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; min-width: 34px; }
.item-attr-val { font-size: 11px; color: var(--text-secondary); flex: 1; }
.item-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.item-tag {
  font-size: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 1px 6px;
  border-radius: 3px;
}

/* ── Upload page ── */
.upload-area {
  border: 1.5px dashed var(--border-strong);
  border-radius: 12px;
  padding: 3rem 2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 24px;
}
.upload-area:hover, .upload-area.drag-over { background: var(--bg-card); border-color: var(--accent); }
.upload-icon { font-size: 36px; color: var(--text-muted); margin-bottom: 12px; }
.upload-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
.upload-sub { font-size: 11px; color: var(--text-muted); }

.upload-queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 280px)); gap: 16px; }
@media (max-width: 680px) {
  .upload-queue { grid-template-columns: 1fr; gap: 12px; }
}
.queue-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.queue-img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  display: block;
  background: #eae6e0;
}
.queue-body { padding: 10px 12px; }
.queue-analyzing {
  position: absolute; inset: 0;
  background: rgba(26,24,20,0.55);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; color: #fff; font-size: 11px;
}
.spinner { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.field-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.field-label { font-size: 10px; color: var(--text-muted); min-width: 28px; }
.field-input {
  font-size: 12px; flex: 1;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
}
.field-input:focus { outline: none; border-color: var(--border-strong); }
select.field-input { cursor: pointer; }

.tag-editor { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag-chip {
  font-size: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 3px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.1s;
}
.tag-chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.save-bar {
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 16px 0 4px;
  display: flex; align-items: center; gap: 12px;
  margin-top: 24px;
}
.save-count { font-size: 13px; color: var(--text-secondary); }

/* ── Memo page ── */
.memo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.memo-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
}
.memo-card-title { font-family: var(--font-serif); font-size: 14px; margin-bottom: 10px; }
.memo-card textarea {
  width: 100%; border: none; background: transparent;
  font-family: var(--font-sans); font-size: 12px;
  color: var(--text-secondary); resize: none;
  line-height: 1.7; min-height: 80px;
  outline: none;
}
.add-memo-btn {
  border: 1.5px dashed var(--border-strong);
  border-radius: 10px;
  padding: 18px 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; color: var(--text-muted);
  transition: all 0.15s;
}
.add-memo-btn:hover { background: var(--bg-card); color: var(--text-secondary); }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(26,24,20,0.6);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-card);
  border-radius: 12px;
  width: 100%;
  max-width: 860px;
  max-height: 92vh;
  overflow: hidden;
  display: flex;
  flex-direction: row;
}
.modal-img-panel {
  width: 300px;
  flex-shrink: 0;
  position: relative;
  background: #1a1814;
  display: flex;
  flex-direction: column;
}
.modal-img {
  width: 100%;
  aspect-ratio: 9/16;
  object-fit: cover;
  object-position: center top;
  display: block;
  background: #eae6e0;
}
.modal-img-placeholder {
  aspect-ratio: 9/16;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  background: #eae6e0;
}
.modal-replace-bar {
  padding: 8px 12px;
  background: rgba(26,24,20,0.75);
  display: flex;
  justify-content: center;
}
.modal-replace-bar button {
  font-size: 11px; padding: 5px 14px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2); background: transparent;
  color: #fff; cursor: pointer; transition: background 0.15s;
}
.modal-replace-bar button:hover { background: rgba(255,255,255,0.1); }
.modal-body {
  flex: 1;
  padding: 22px 24px;
  overflow-y: auto;
  min-width: 0;
}
.modal-close {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; font-size: 14px; color: var(--text-secondary);
  background: transparent; transition: all 0.1s; flex-shrink: 0;
}
.modal-close:hover { background: var(--bg); }
.modal-section-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.modal-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.attr-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.attr-box-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.attr-box-val { font-size: 13px; color: var(--text-primary); }
.attr-box-empty { color: var(--text-muted); font-size: 12px; }

@media (max-width: 680px) {
  .modal {
    flex-direction: column;
    max-height: 92vh;
    border-radius: 16px 16px 0 0;
    align-self: flex-end;
    margin: 0;
    max-width: 100%;
    width: 100%;
  }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal-img-panel {
    width: 100%;
    max-height: 52vh;
  }
  .modal-img {
    width: 100%;
    max-height: 52vh;
    object-fit: contain;
    background: #1a1814;
  }
  .modal-body { padding: 16px; }
}

/* ── Lookbook ── */
.lookbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.lookbook-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.15s;
}
.lookbook-card:hover { border-color: var(--border-strong); box-shadow: 0 4px 16px rgba(0,0,0,0.07); transform: translateY(-2px); }
.lookbook-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #eae6e0; }
.lookbook-body { padding: 10px 14px; }
.lookbook-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.lookbook-link-chip {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  background: var(--bg);
}

/* ── Lookbook modal ── */
.lb-modal-img { width: 100%; max-height: 50vh; object-fit: contain; background: #1a1814; display: block; }
.lb-item-picker {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
  max-height: 240px;
  overflow-y: auto;
  padding: 2px;
}
.lb-picker-item {
  border: 2px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
}
.lb-picker-item:hover { border-color: var(--border-strong); }
.lb-picker-item.selected { border-color: var(--accent); }
.lb-picker-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.lb-picker-check {
  position: absolute; top: 3px; right: 3px;
  width: 16px; height: 16px;
  background: var(--accent); color: #fff;
  border-radius: 50%; font-size: 9px;
  display: none; align-items: center; justify-content: center;
}
.lb-picker-item.selected .lb-picker-check { display: flex; }
.lb-picker-label { font-size: 9px; color: var(--text-muted); padding: 3px 4px; text-align: center; line-height: 1.3; }

/* ── Category management ── */
.cat-mgmt-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
}
.cat-mgmt-icon-btn {
  font-size: 20px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  transition: background 0.1s;
  user-select: none;
}
.cat-mgmt-icon-btn:hover { background: var(--bg); }
.cat-mgmt-name {
  border-color: transparent;
  background: transparent;
  font-size: 13px;
}
.cat-mgmt-name:hover, .cat-mgmt-name:focus { border-color: var(--border-strong); background: var(--bg); }
.cat-mgmt-del {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  flex-shrink: 0;
}
.cat-mgmt-del:hover:not(:disabled) { background: #e74c3c; color: #fff; border-color: #e74c3c; }
.cat-mgmt-del:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}
.empty-icon { font-size: 40px; margin-bottom: 16px; }
.empty-text { font-size: 14px; }

/* ── Misc ── */
.section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
.section-title { font-family: var(--font-serif); font-size: 18px; font-weight: 400; }
.section-sub { font-size: 12px; color: var(--text-muted); }

/* ── Mobile ── */
.menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border: none; background: transparent;
  cursor: pointer; flex-shrink: 0;
  border-radius: 6px;
  transition: background 0.15s;
}
.menu-btn:hover { background: var(--border); }
.menu-btn svg { width: 18px; height: 18px; stroke: var(--text-primary); stroke-width: 1.8; fill: none; }

#sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 19;
  backdrop-filter: blur(1px);
}

@media (max-width: 680px) {
  body { overflow: hidden; }

  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    width: 240px;
  }
  #sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 24px rgba(0,0,0,0.3);
  }
  #sidebar-overlay.open { display: block; }

  .menu-btn { display: flex; }

  .topbar {
    padding: 0 16px;
    gap: 10px;
  }

<script>
// ── Data ──
const DEFAULT_CATS = {
  top_fitted: { name: '貼身上衣', icon: '👕' },
  two_piece:  { name: '兩件套',   icon: '🧥' },
  top_other:  { name: '其他上衣', icon: '👔' },
  outer:      { name: '外套',     icon: '🧣' },
  bottom:     { name: '下身',     icon: '👖' },
  dress:      { name: '洋裝',     icon: '👗' },
  other:      { name: '其他',     icon: '📦' }
};
let CATS = JSON.parse(localStorage.getItem('clothing_cats') || 'null') || DEFAULT_CATS;
function saveCats() { localStorage.setItem('clothing_cats', JSON.stringify(CATS)); }const SIZES_PRESET  = ['F','XS','S','M','L','XL'];

const PRICE_COLORS = {
  350: { bg: '#7b9e87', text: '#fff' },  // sage green
  400: { bg: '#6b9aaa', text: '#fff' },  // dusty blue
  450: { bg: '#8b7faa', text: '#fff' },  // lavender
  500: { bg: '#b07d8a', text: '#fff' },  // dusty rose
  550: { bg: '#b8936a', text: '#fff' },  // warm sand
  600: { bg: '#a07860', text: '#fff' },  // terracotta
  650: { bg: '#7a8fa0', text: '#fff' },  // slate blue
  700: { bg: '#9b7baa', text: '#fff' },  // plum
  750: { bg: '#c4956a', text: '#fff' },  // caramel
  800: { bg: '#6a9e8a', text: '#fff' },  // teal
  850: { bg: '#8b6b8b', text: '#fff' },  // mauve
  900: { bg: '#7a8a5a', text: '#fff' },  // olive
  950: { bg: '#9b6b6b', text: '#fff' },  // brick
  1000: { bg: '#5a7a9b', text: '#fff' }, // steel blue
  1100: { bg: '#8a9b6a', text: '#fff' }, // moss
  1200: { bg: '#9b8a5a', text: '#fff' }, // gold
  1300: { bg: '#6a8a7a', text: '#fff' }, // sage teal
  1500: { bg: '#8a6a7a', text: '#fff' }, // antique rose
  1800: { bg: '#6a7a5a', text: '#fff' }, // forest
  2000: { bg: '#5a6a8a', text: '#fff' }, // navy
};
function getPriceColor(price) {
  if (!price) return { bg: '#8a8078', text: '#fff' };
  if (PRICE_COLORS[price]) return PRICE_COLORS[price];
  // Auto-generate unique color for any price not in table
  // Use price to deterministically pick a hue
  const hue = (price * 37 + 180) % 360;
  return { bg: `hsl(${hue}, 35%, 52%)`, text: '#fff' };
}

// ── Cloud Config ──
const CLOUDINARY_CLOUD = 'dfsxm3vdp';
const CLOUDINARY_PRESET = 'mili FJSS';
const JSONBIN_BIN = '6a020b1ac0954111d80ab2f8';
const JSONBIN_KEY = '$2a$10$k6Hj1ykzTwxMS1N7Xm9Lhe6PTHDRfH3UPFt8kxkgfSR8W90CNQ2pq';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN}`;

let db = { items: [], memos: [] };
let currentPage = 'home';
let currentCat = null;
let uploadQueue = [];
let isSaving = false;

// ── Load from cloud on start ──
async function loadFromCloud() {
  showGlobalLoading(true);
  try {
    const resp = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await resp.json();
    if (data.record) {
      db = { items: data.record.items || [], memos: data.record.memos || [], lookbook: data.record.lookbook || [] };
    }
  } catch(e) {
    console.warn('Cloud load failed, using empty db', e);
  }
  showGlobalLoading(false);
  renderPage();
}

async function save() {
  if (isSaving) return;
  isSaving = true;
  showSyncIndicator('saving');
  try {
    const payload = { items: db.items, memos: db.memos, lookbook: db.lookbook || [] };
    console.log('Saving to JSONBin, items count:', db.items.length);
    const resp = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    console.log('JSONBin save response:', resp.status, JSON.stringify(result).slice(0, 200));
    if (!resp.ok) throw new Error(`JSONBin error: ${resp.status} ${JSON.stringify(result)}`);
    showSyncIndicator('saved');
  } catch(e) {
    console.error('Save failed:', e);
    showSyncIndicator('error');
  }
  isSaving = false;
}

async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
    method: 'POST',
    body: formData
  });
  const data = await resp.json();
  if (!data.secure_url) throw new Error('Cloudinary upload failed');
  return data.secure_url;
}

function showGlobalLoading(on) {
  let el = document.getElementById('global-loading');
  if (!el) {
    el = document.createElement('div');
    el.id = 'global-loading';
    el.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px';
    el.innerHTML = '<div class="spinner" style="width:28px;height:28px;border-color:rgba(26,24,20,0.15);border-top-color:var(--text-primary)"></div><div style="font-size:13px;color:var(--text-secondary)">載入中…</div>';
    document.body.appendChild(el);
  }
  el.style.display = on ? 'flex' : 'none';
}

function showSyncIndicator(state) {
  let el = document.getElementById('sync-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-indicator';
    el.style.cssText = 'position:fixed;bottom:16px;right:16px;font-size:11px;padding:5px 12px;border-radius:20px;z-index:50;transition:all 0.3s;pointer-events:none';
    document.body.appendChild(el);
  }
  if (state === 'saving') {
    el.style.background = 'var(--text-primary)'; el.style.color = 'var(--bg)'; el.style.opacity = '1';
    el.textContent = '同步中…';
  } else if (state === 'saved') {
    el.style.background = '#7b9e87'; el.style.color = '#fff'; el.style.opacity = '1';
    el.textContent = '✓ 已同步';
    setTimeout(() => { el.style.opacity = '0'; }, 2000);
  } else {
    el.style.background = '#c8392b'; el.style.color = '#fff'; el.style.opacity = '1';
    el.textContent = '⚠ 同步失敗';
  }
}

function genId() { return 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ── Navigate ──
function navigate(page, cat) {
  currentPage = page;
  currentCat = cat || null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + (['board'].includes(page) ? 'home' : page));
  if (navEl) navEl.classList.add('active');
  closeSidebar();
  if (page !== 'home') homeSearch = '';
  renderPage();
}

function renderPage() {
  updateSidebarCounts();
  const pages = { home: renderHome, upload: renderUpload, memo: renderMemo, catMgmt: renderCatMgmt, lookbook: renderLookbook, settings: renderSettings };
  (pages[currentPage] || renderHome)();
}

function updateSidebarCounts() {
  document.getElementById('sc-home').textContent = db.items.length;
  const lbEl = document.getElementById('sc-lookbook');
  if (lbEl) lbEl.textContent = (db.lookbook||[]).length;
}

function setTopbar(title, bc, actions = '') {
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('topbar-bc').innerHTML = bc;
  document.getElementById('topbar-actions').innerHTML = actions;
}

// ── Home ──
let homeFilter = 'all';
let homeSearch = '';

function renderHome() {
  setTopbar('商品總覽', '', `<button class="btn btn-accent" onclick="navigate('upload')">＋ 上傳新品</button>`);

  // Apply search + category filter
  let filtered = homeFilter === 'all' ? db.items : db.items.filter(i => i.category === homeFilter);
  if (homeSearch.trim()) {
    const q = homeSearch.trim().toLowerCase();
    filtered = filtered.filter(i => {
      const cat = CATS[i.category];
      return (i.note||'').toLowerCase().includes(q)
        || (i.colors||[]).some(c => c.toLowerCase().includes(q))
        || (i.sizes||[]).some(s => s.toLowerCase().includes(q))
        || (cat && cat.name.toLowerCase().includes(q))
        || String(i.price||'').includes(q);
    });
  }

  // Search bar
  let html = `<div style="position:relative;margin-bottom:14px">
    <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none">🔍</span>
    <input type="text" id="search-input" value="${homeSearch.replace(/"/g,'&quot;')}"
      placeholder="搜尋特徵、顏色、尺寸…"
      oninput="setHomeSearch(this.value)"
      style="width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);font-size:13px;font-family:var(--font-sans);color:var(--text-primary);outline:none;box-sizing:border-box"
      onfocus="this.style.borderColor='var(--border-strong)'"
      onblur="this.style.borderColor='var(--border)'">
    ${homeSearch ? `<span onclick="setHomeSearch('')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:13px;color:var(--text-muted)">✕</span>` : ''}
  </div>`;

  // Tab bar
  const tabs = [['all','全部款式', db.items.length], ...Object.entries(CATS).map(([k,v]) => [k, v.name, db.items.filter(i=>i.category===k).length])];
  const tabHtml = tabs.map(([key, label, cnt]) =>
    `<button class="filter-tab${homeFilter===key?' active':''}" onclick="setHomeFilter('${key}')">${label}<span class="filter-tab-count">${cnt}</span></button>`
  ).join('');

  html += `<div class="filter-tabs" id="filter-tabs">${tabHtml}</div>`;

  if (!filtered.length) {
    const emptyMsg = homeSearch
      ? `沒有符合「${homeSearch}」的商品`
      : '這個分類還沒有商品<br><span style="cursor:pointer;color:var(--accent)" onclick="navigate(\'upload\')">去上傳新品 →</span>';
    html += `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">${emptyMsg}</div></div>`;
    document.getElementById('page-content').innerHTML = html;
    // restore focus if searching
    if (homeSearch) { const el = document.getElementById('search-input'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }
    return;
  }

  // Sort all filtered items by price (nulls last)
  const sortedItems = [...filtered].sort((a, b) => {
    if (!a.price && !b.price) return 0;
    if (!a.price) return 1;
    if (!b.price) return -1;
    return a.price - b.price;
  });

  html += `<div class="items-grid">`;
  sortedItems.forEach(item => {
    const cat = CATS[item.category] || { icon: '📦', name: '其他' };
    const pc = getPriceColor(item.price);
    const colorsStr = (item.colors||[]).map(c=>`<span class="item-tag">${c}</span>`).join('');
    const sizesStr  = (item.sizes||[]).map(s=>`<span class="item-tag">${s}</span>`).join('');
    const accStr    = (item.accessories||[]).map(a=>`<span class="item-tag" style="border-color:var(--accent);color:var(--accent)">${a}</span>`).join('');
    html += `<div class="item-card" onclick="openModal('${item.id}')">
      <div class="item-price-banner" style="background:${item.price ? pc.bg : 'var(--text-muted)'};color:${pc.text}">${item.price ? '$'+item.price : '?'}</div>
      <div style="background:${item.price ? pc.bg+'18' : 'rgba(0,0,0,0.04)'};padding:3px 12px;font-size:10px;color:${item.price ? pc.bg : 'var(--text-muted)'};letter-spacing:0.04em">${cat.icon} ${cat.name}</div>
      <div class="item-img-wrap">
        ${item.url ? `<img src="${item.url}" alt="" loading="lazy">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#b0aa9f;font-size:28px">${cat.icon}</div>`}
      </div>
      <div class="item-body">
        <div class="item-attr-row">
          <span class="item-attr-label">特徵</span>
          <span class="item-attr-val">${item.note || '—'}</span>
        </div>
        ${sizesStr ? `<div class="item-attr-row"><span class="item-attr-label">Size</span><div class="item-tags">${sizesStr}</div></div>` : ''}
        ${colorsStr ? `<div class="item-attr-row"><span class="item-attr-label">Color</span><div class="item-tags">${colorsStr}</div></div>` : ''}
        ${accStr ? `<div class="item-attr-row"><span class="item-attr-label">附件</span><div class="item-tags">${accStr}</div></div>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;

  document.getElementById('page-content').innerHTML = html;
}

function setHomeFilter(key) {
  homeFilter = key;
  renderHome();
  // restore search input focus
  const el = document.getElementById('search-input');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function setHomeSearch(val) {
  homeSearch = val;
  renderHome();
}

// ── Upload ──
function renderUpload() {
  setTopbar('上傳新品', '');
  uploadQueue = [];

  let html = `
  <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
    <div class="upload-icon">📷</div>
    <div class="upload-text">點此選擇照片，或將照片拖曳到這裡</div>
    <div class="upload-sub">AI 會自動辨識紅字標價與款式類型，可以一次上傳多張</div>
  </div>
  <div id="queue-container"></div>
  <div class="save-bar" id="save-bar" style="display:none">
    <span class="save-count" id="save-count-text"></span>
    <button class="btn btn-ghost" onclick="uploadQueue=[];renderUpload()">清除全部</button>
    <button class="btn btn-accent" onclick="saveAll()">儲存所有商品</button>
  </div>`;
  document.getElementById('page-content').innerHTML = html;

  const ua = document.getElementById('upload-area');
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag-over'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('drag-over'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
}

async function handleFiles(files) {
  const arr = Array.from(files);
  for (const file of arr) {
    const url = URL.createObjectURL(file);
    const entry = { id: genId(), file, url, price: null, category: 'top_other', note: '', colors: [], sizes: ['F'], analyzing: true };
    uploadQueue.push(entry);
  }
  renderQueue();
  for (const entry of uploadQueue.filter(e => e.analyzing)) {
    await analyzeImage(entry);
  }
}

function renderQueue() {
  const container = document.getElementById('queue-container');
  if (!container) return;
  if (!uploadQueue.length) { container.innerHTML = ''; return; }

  const saveBar = document.getElementById('save-bar');
  if (saveBar) { saveBar.style.display = 'flex'; document.getElementById('save-count-text').textContent = `${uploadQueue.length} 件待儲存`; }

  // First render
  if (!container.querySelector('.upload-queue')) {
    const grid = document.createElement('div');
    grid.className = 'upload-queue';
    uploadQueue.forEach(entry => {
      grid.appendChild(createQueueCard(entry));
    });
    container.appendChild(grid);
    return;
  }

  // Update: add new, remove deleted, update analyzing state
  const grid = container.querySelector('.upload-queue');
  const existingIds = new Set([...grid.querySelectorAll('.queue-card')].map(el => el.id.replace('qc-', '')));
  const currentIds = new Set(uploadQueue.map(e => e.id));

  // Remove deleted
  existingIds.forEach(id => {
    if (!currentIds.has(id)) grid.getElementById?.(`qc-${id}`)?.remove();
  });

  uploadQueue.forEach(entry => {
    const existing = document.getElementById(`qc-${entry.id}`);
    if (!existing) {
      grid.appendChild(createQueueCard(entry));
    } else {
      // Only update analyzing overlay
      const overlay = existing.querySelector('.queue-analyzing');
      if (!entry.analyzing && overlay) overlay.remove();
      // Fill in AI results if fields are empty
      if (entry.price) {
        const priceInput = existing.querySelector('input[type="number"]');
        if (priceInput && !priceInput.value) priceInput.value = entry.price;
      }
      if (entry.note) {
        const noteInput = existing.querySelector('input[type="text"]');
        if (noteInput && !noteInput.value) noteInput.value = entry.note;
      }
      if (entry.category) {
        const sel = existing.querySelector('select');
        if (sel) sel.value = entry.category;
      }
      if (entry.colors && entry.colors.length) {
        const colorTags = document.getElementById(`color-tags-${entry.id}`);
        if (colorTags && !colorTags.children.length) {
          entry.colors.forEach(c => {
            const chip = document.createElement('span');
            chip.className = 'tag-chip selected';
            chip.textContent = c + ' ✕';
            chip.onclick = () => removeColorTag(entry.id, c, chip);
            colorTags.appendChild(chip);
          });
        }
      }
    }
  });
}

function createQueueCard(entry) {
  const div = document.createElement('div');
  div.className = 'queue-card';
  div.id = `qc-${entry.id}`;

  const sizeTagsHtml = SIZES_PRESET.map(s =>
    `<span class="tag-chip${(entry.sizes||[]).includes(s)?' selected':''}" onclick="toggleTag('${entry.id}','sizes','${s}',this)">${s}</span>`
  ).join('');

  div.innerHTML = `
    <div style="position:relative;aspect-ratio:3/4;overflow:hidden;background:#eae6e0">
      <img src="${entry.url}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">

function replaceQueuePhoto(id, file) {
  if (!file) return;
  const entry = uploadQueue.find(e => e.id === id);
  if (!entry) return;
  entry.file = file;
  entry.url = URL.createObjectURL(file);
  entry.cloudUrl = null; // reset so it re-uploads
  const img = document.getElementById('qimg-' + id);
  if (img) img.src = entry.url;
}

function addColorTag(event, id) {
  if (event.key !== 'Enter') return;
  const input = event.target;
  const val = input.value.trim();
  if (!val) return;
  const entry = uploadQueue.find(e => e.id === id);
  if (!entry) return;
  if (!entry.colors) entry.colors = [];
  if (!entry.colors.includes(val)) {
    entry.colors.push(val);
    const container = document.getElementById('color-tags-' + id);
    if (container) {
      const chip = document.createElement('span');
      chip.className = 'tag-chip selected';
      chip.textContent = val + ' ✕';
      chip.onclick = () => removeColorTag(id, val, chip);
      container.appendChild(chip);
    }
  }
  input.value = '';
}

function removeColorTag(id, val, el) {
  const entry = uploadQueue.find(e => e.id === id);
  if (entry) entry.colors = (entry.colors||[]).filter(c => c !== val);
  el.remove();
}

function removeFromQueue(id) {
  uploadQueue = uploadQueue.filter(e => e.id !== id);
  renderQueue();
}

function updateQueue(id, field, val) {
  const entry = uploadQueue.find(e => e.id === id);
  if (entry) entry[field] = val;
}

function toggleAccessory(id, val, checked) {
  const entry = uploadQueue.find(e => e.id === id);
  if (!entry) return;
  if (!entry.accessories) entry.accessories = [];
  if (checked) { if (!entry.accessories.includes(val)) entry.accessories.push(val); }
  else entry.accessories = entry.accessories.filter(a => a !== val);
}

function toggleTag(id, field, val, el) {
  const entry = uploadQueue.find(e => e.id === id);
  if (!entry) return;
  const arr = entry[field] || [];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(val);
  entry[field] = arr;
  el.classList.toggle('selected');
}

async function analyzeImage(entry) {
  try {
    const url = await uploadToCloudinary(entry.file);
    entry.cloudUrl = url;
  } catch(e) {
    console.warn('Cloudinary upload failed', e);
    entry.cloudUrl = entry.url;
  }

  try {
    const base64 = await toBase64(entry.file);
    const mt = entry.file.type || 'image/jpeg';

    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64: base64,
        mediaType: mt,
        filename: entry.file.name
      })
    });
    const parsed = await resp.json();
    entry.price = parsed.price || null;
    entry.category = parsed.category || 'top_other';
    entry.colors = parsed.colors || [];
    entry.note = parsed.note || '';
  } catch(e) {
    console.error('Analyze failed:', e);
  }
  entry.analyzing = false;
  renderQueue();
}

function toBase64(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function saveAll() {
  const ready = uploadQueue.filter(e => !e.analyzing);
  ready.forEach(entry => {
    db.items.push({
      id: entry.id,
      url: entry.cloudUrl || entry.url,
      price: entry.price,
      category: entry.category,
      note: entry.note,
      colors: entry.colors || [],
      sizes: entry.sizes || [],
      accessories: entry.accessories || [],
      createdAt: Date.now()
    });
  });
  await save();
  uploadQueue = [];
  navigate('home');
}

async function handleLbFiles(files) {

      if (!db.lookbook) db.lookbook = [];
      db.lookbook.push(photo);
    } catch(e) { console.error('Lookbook upload failed', e); }
  }
  await save();
  showGlobalLoading(false);
  renderLookbook();
}

  let html = `
    <div class="section-header">
      <div class="section-title">分類管理</div>
      <div class="section-sub">新增、修改、刪除分類</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:520px" id="cat-list">`;

  Object.entries(CATS).forEach(([key, cat]) => {
    const count = db.items.filter(i => i.category === key).length;
    html += `<div class="cat-mgmt-row" id="catrow-${key}">
      <div class="cat-mgmt-icon-btn" onclick="cycleCatIcon('${key}')" title="點擊換圖示">${cat.icon}</div>
      <input class="field-input cat-mgmt-name" value="${cat.name}" onchange="updateCatName('${key}',this.value)" style="flex:1">
      <span style="font-size:11px;color:var(--text-muted);min-width:36px;text-align:right">${count} 件</span>
      <button class="cat-mgmt-del" onclick="deleteCat('${key}')" ${count > 0 ? 'disabled title="還有商品無法刪除"' : 'title="刪除分類"'}>✕</button>
    </div>`;
  });

  html += `</div>
    <div style="margin-top:16px;max-width:520px">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">新增分類</div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="new-cat-icon" style="font-size:22px;cursor:pointer;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card)" onclick="cycleNewIcon()" title="點擊換圖示">📦</span>
        <input type="text" class="field-input" id="new-cat-name" placeholder="輸入分類名稱" style="flex:1">
        <button class="btn btn-accent" onclick="addCat()">新增</button>
      </div>
    </div>
    <div style="margin-top:20px;max-width:520px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px">
      <div style="font-size:11px;color:var(--text-muted);line-height:1.8">
        • 有商品的分類無法刪除，請先將商品移到其他分類<br>
        • 點圖示可以切換 emoji<br>
        • 修改名稱後即時儲存
      </div>
    </div>`;

  document.getElementById('page-content').innerHTML = html;
}

let newIconIdx = 0;
function cycleNewIcon() {
  newIconIdx = (newIconIdx + 1) % CAT_ICONS.length;
  document.getElementById('new-cat-icon').textContent = CAT_ICONS[newIconIdx];
}

function cycleCatIcon(key) {
  const icons = CAT_ICONS;
  const cur = CATS[key].icon;
  const idx = icons.indexOf(cur);
  CATS[key].icon = icons[(idx + 1) % icons.length];
  saveCats();
  renderCatMgmt();
}

function updateCatName(key, val) {
  if (!val.trim()) return;
  CATS[key].name = val.trim();
  saveCats();
}

function deleteCat(key) {
  const count = db.items.filter(i => i.category === key).length;
  if (count > 0) return;
  if (!confirm(`確定要刪除「${CATS[key].name}」分類嗎？`)) return;
  delete CATS[key];
  saveCats();
  renderCatMgmt();
}

function addCat() {
  const nameEl = document.getElementById('new-cat-name');
  const iconEl = document.getElementById('new-cat-icon');
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const key = 'cat_' + Date.now();
  CATS[key] = { name, icon: iconEl.textContent };
  saveCats();
  nameEl.value = '';
  newIconIdx = 0;
  iconEl.textContent = '📦';
  renderCatMgmt();
}


// ── Settings ──
function renderSettings() {
  setTopbar('設定', '');
  document.getElementById('page-content').innerHTML = `
    <div class="section-header">
      <div class="section-title">設定</div>
    </div>

    <div style="max-width:520px;display:flex;flex-direction:column;gap:12px;">

      <div class="memo-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div>
            <div style="font-family:var(--font-serif);font-size:14px;margin-bottom:3px">商品資料</div>
            <div style="font-size:12px;color:var(--text-muted)">儲存於 JSONBin 雲端</div>
          </div>
          <span style="font-size:12px;color:var(--text-secondary)">${db.items.length} 件商品</span>
        </div>
      </div>

      <div class="memo-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div>
            <div style="font-family:var(--font-serif);font-size:14px;margin-bottom:3px">穿拍圖庫</div>
            <div style="font-size:12px;color:var(--text-muted)">照片儲存於 Cloudinary</div>
          </div>
          <span style="font-size:12px;color:var(--text-secondary)">${(db.lookbook||[]).length} 張</span>
        </div>
      </div>

      <div class="memo-card" style="border-color:rgba(200,57,43,0.2)">
        <div style="font-family:var(--font-serif);font-size:14px;margin-bottom:6px;color:#c8392b">危險區域</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.6">清除所有商品、備忘錄、穿拍資料。照片不會從 Cloudinary 刪除。此動作無法復原。</div>
        <button onclick="clearAllData()" style="font-size:12px;padding:7px 16px;border-radius:6px;border:1px solid rgba(200,57,43,0.4);background:transparent;color:#c8392b;cursor:pointer;transition:all 0.15s" onmouseover="this.style.background='rgba(200,57,43,0.08)'" onmouseout="this.style.background='transparent'">清除所有資料</button>
      </div>

    </div>`;
}

function clearAllData() {
  if (confirm('確定要清除所有商品資料嗎？此動作無法復原。')) {
    localStorage.removeItem('clothing_db');
    db = { items: [], memos: [] };
    navigate('home');
  }
}

// ── Init ──
loadFromCloud();
</script>

</html>
